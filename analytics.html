<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monthly Analytics — ORBIT</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="app-body">
    <div class="app-layout">
        <aside class="sidebar">
            <div class="sidebar-brand">
                <h2>ORBIT<span>.</span></h2>
                <span class="version-tag">v1.0.0</span>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">Overview</a>
                <a href="transactions.html" class="nav-item">Transactions</a>
                <a href="reports.html" class="nav-item">Weekly Report</a>
                <a href="analytics.html" class="nav-item active">Monthly Analytics</a>
                <a href="settings.html" class="nav-item">Settings</a>
            </nav>
            <div class="sidebar-footer">
                <div id="user-email-display" class="user-email">Memuat akun...</div>
                <button id="logout-btn" class="btn-logout">Keluar</button>
            </div>
        </aside>

        <main class="main-content">
            <header class="content-header">
                <div>
                    <h1>Analisis Bulanan</h1>
                    <p class="date-subtitle">Laporan komprehensif tren dan distribusi finansial.</p>
                </div>
                <div class="month-navigation">
                    <input type="month" id="analytics-month-picker" class="swiss-input">
                </div>
            </header>

            <section class="dashboard-grid">
                <div class="card span-two">
                    <div class="card-header">
                        <h3>Tren Keuangan Bulanan</h3>
                    </div>
                    <div class="chart-container">
                        <canvas id="analyticsTrendChart"></canvas>
                    </div>
                </div>
                <div class="card">
                    <div class="card-header">
                        <h3>Donut Distribusi Pengeluaran</h3>
                    </div>
                    <div class="chart-container">
                        <canvas id="analyticsDonutChart"></canvas>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script type="module" src="js/analytics.js"></script>
</body>
</html>
