<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings — ORBIT</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="app-body">
    <div class="app-layout">
        <aside class="sidebar">
            <div class="sidebar-brand">
                <h2>ORBIT<span>.</span></h2>
                <span class="version-tag">v1.0.0</span>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">Overview</a>
                <a href="transactions.html" class="nav-item">Transactions</a>
                <a href="reports.html" class="nav-item">Weekly Report</a>
                <a href="analytics.html" class="nav-item">Monthly Analytics</a>
                <a href="settings.html" class="nav-item active">Settings</a>
            </nav>
            <div class="sidebar-footer">
                <div id="user-email-display" class="user-email">Memuat akun...</div>
                <button id="logout-btn" class="btn-logout">Keluar</button>
            </div>
        </aside>

        <main class="main-content">
            <header class="content-header">
                <div>
                    <h1>Pengaturan Akun</h1>
                    <p class="date-subtitle">Kelola informasi akun dan preferensi aplikasi.</p>
                </div>
            </header>

            <section class="card settings-card">
                <h3>Informasi Akun</h3>
                <div class="setting-item">
                    <span class="setting-label">Email Terdaftar</span>
                    <span class="setting-value" id="settings-email">-</span>
                </div>
                <div class="setting-item">
                    <span class="setting-label">Mata Uang Default</span>
                    <span class="setting-value">IDR (Indonesian Rupiah)</span>
                </div>
                <div class="setting-item">
                    <span class="setting-label">Tema Tampilan</span>
                    <span class="setting-value">Swiss International Style (Light)</span>
                </div>
                <div class="setting-actions">
                    <button class="btn-swiss-danger" id="settings-logout-btn">Keluar Sesi</button>
                </div>
            </section>
        </main>
    </div>

    <!-- Login/Register Auth Modal Overlay if not authenticated -->
    <div id="auth-modal" class="swiss-modal" style="display: none;">
        <div class="modal-content auth-container">
            <div class="modal-header">
                <h3 id="auth-modal-title">Masuk ke ORBIT</h3>
            </div>
            <form id="auth-form">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="auth-email" class="swiss-input" placeholder="nama@email.com" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="auth-password" class="swiss-input" placeholder="••••••••" required minlength="6">
                </div>
                <div class="modal-actions column">
                    <button type="submit" class="btn-swiss-primary width-full" id="auth-submit-btn">Masuk</button>
                    <button type="button" class="btn-text-only" id="toggle-auth-mode">Belum punya akun? Daftar</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="js/auth.js"></script>
</body>
</html>
